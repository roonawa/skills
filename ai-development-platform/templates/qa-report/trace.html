<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA のつながり</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --surface: #ffffff; --surface-sunken: #eef1f5; --border: #d9dfe7;
    --ink: #1b2333; --ink-muted: #5c6472; --accent: #2f4c7a; --accent-soft: #e7edf6;
    --good: #2e7d4f; --good-soft: #e4f1e9; --bad: #a6342a; --bad-soft: #f5e4e1;
    --warn: #96631b; --warn-soft: #f6ecd9;
    --shadow: 0 1px 2px rgba(27,35,51,.06), 0 8px 24px rgba(27,35,51,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg:#12161d; --surface:#1a2029; --surface-sunken:#212833; --border:#303948;
      --ink:#e7eaf0; --ink-muted:#9aa5b4; --accent:#8caadd; --accent-soft:#223349;
      --good:#79d6a5; --good-soft:#1d3327; --bad:#e0897c; --bad-soft:#3a2321;
      --warn:#e0b268; --warn-soft:#3a2f17; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#12161d; --surface:#1a2029; --surface-sunken:#212833; --border:#303948;
    --ink:#e7eaf0; --ink-muted:#9aa5b4; --accent:#8caadd; --accent-soft:#223349;
    --good:#79d6a5; --good-soft:#1d3327; --bad:#e0897c; --bad-soft:#3a2321;
    --warn:#e0b268; --warn-soft:#3a2f17; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
  :root[data-theme="light"] {
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "游ゴシック体","Yu Gothic Medium",YuGothic,"Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;
    font-size: 15.5px; line-height: 1.8; -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1400px; margin: 0 auto; padding: 2.5rem 1rem 5rem; }
  .mono { font-family: "SFMono-Regular","SF Mono",Consolas,monospace; font-size: .85em; }
  .muted { color: var(--ink-muted); }

  header.doc { border-bottom: 1px solid var(--border); padding-bottom: 1.75rem; margin-bottom: 2rem; }
  .eyebrow {
    display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .14em;
    color: var(--accent); background: var(--accent-soft); padding: .28rem .65rem; border-radius: 3px; margin-bottom: .9rem;
  }
  h1.doc-title { font-size: 1.7rem; font-weight: 700; line-height: 1.45; margin: 0 0 1rem; text-wrap: balance; }
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap: .8rem 1.5rem; }
  .meta-item .k { font-size: .72rem; color: var(--ink-muted); letter-spacing: .04em; margin-bottom: .15rem; }
  .meta-item .v { font-size: .93rem; font-weight: 600; }

  .summary-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: .8rem; margin: 1.6rem 0 0; }
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .8rem 1rem; box-shadow: var(--shadow); }
  .summary-card .label { font-size: .72rem; color: var(--ink-muted); margin-bottom: .35rem; }
  .summary-card .counts { display: flex; flex-wrap: wrap; gap: .2rem .6rem; align-items: baseline; }
  .summary-card .n { font-family: "SFMono-Regular","SF Mono",Consolas,monospace; font-weight: 700; font-size: 1.1rem; }
  .summary-card .n.good { color: var(--good); } .summary-card .n.bad { color: var(--bad); }
  .summary-card .n.warn { color: var(--warn); } .summary-card .n.muted { color: var(--ink-muted); }
  .summary-card .l { font-size: .7rem; color: var(--ink-muted); margin-right: .3rem; }

  section.part { margin: 2.6rem 0; }
  h2.part-title {
    display: flex; align-items: baseline; gap: .6rem; font-size: 1.2rem; font-weight: 700;
    margin: 0 0 1.1rem; padding-bottom: .55rem; border-bottom: 2px solid var(--accent);
  }
  h2.part-title .count { font-size: .78rem; font-weight: 600; color: var(--ink-muted); }

  .ac { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.2rem 1.1rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
  .ac-head { display: flex; gap: .7rem; align-items: baseline; flex-wrap: wrap; margin-bottom: .6rem; }
  .ac-id { font-weight: 700; }
  .ac-text { flex: 1 1 20rem; }
  .ac-source { font-size: .78rem; color: var(--ink-muted); }
  .empty { padding: .6rem .7rem; font-size: .85rem; color: var(--bad); background: var(--bad-soft); border-radius: 6px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; vertical-align: top; padding: .4rem .6rem; border-bottom: 1px solid var(--border); }
  th { font-size: .72rem; font-weight: 600; color: var(--ink-muted); background: var(--surface-sunken); white-space: nowrap; }
  td.nowrap { white-space: nowrap; }
  td.path { word-break: break-all; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }

  .pill { display: inline-block; font-size: .68rem; font-weight: 700; padding: .1rem .5rem; border-radius: 999px; letter-spacing: .03em; white-space: nowrap; }
  .pill.ok { background: var(--good-soft); color: var(--good); }
  .pill.ng { background: var(--bad-soft); color: var(--bad); }
  .pill.pending { background: var(--warn-soft); color: var(--warn); }
  .pill.none { background: var(--surface-sunken); color: var(--ink-muted); }
  details summary { cursor: pointer; color: var(--accent); }
  ul.folded { margin: .4rem 0 0; padding-left: 1.1rem; }
  ul.folded li { margin: .1rem 0; }
  .issue { display: inline-flex; gap: .3rem; align-items: baseline; margin-right: .5rem; white-space: nowrap; }

  footer.doc { margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--border); font-size: .78rem; color: var(--ink-muted); }
  @media (max-width: 640px) { h1.doc-title { font-size: 1.35rem; } th, td { padding: .35rem .4rem; } }
</style>
</head>
<body>
<div class="page">

  <header class="doc">
    <span class="eyebrow">QA のつながり</span>
    <h1 class="doc-title">受け入れ条件・テストケース・結果・Issue のつながり</h1>
    <div class="meta-grid">
      <div class="meta-item"><div class="k">作成日時</div><div class="v">{{GENERATED_AT}}</div></div>
      <div class="meta-item"><div class="k">受け入れ条件（AC）</div><div class="v" data-count="acs">{{ACS}}</div></div>
      <div class="meta-item"><div class="k">テストケース（TC）</div><div class="v" data-count="cases">{{CASES}}</div></div>
      <div class="meta-item"><div class="k">run</div><div class="v" data-count="runs">{{RUNS}}</div></div>
    </div>
    <div class="summary-row">
      {{SUMMARY_CARDS}}
    </div>
  </header>

  {{BODY}}

  <footer class="doc">aidev qa trace が作成しました。結果は各 TC の最新の run のものです。result.md の再現手順・実際の結果・理由・メモと、証跡の列は載せていません。</footer>
</div>
</body>
</html>
