<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サイト診断・危険度評価｜操作モックアップ</title>
<style>
:root{--navy:#173446;--teal:#00786e;--pale:#e7f4ef;--line:#dce5e8;--muted:#596d79;--amber:#946018;--red:#af443b}*{box-sizing:border-box}body{margin:0;background:#f3f6f7;color:var(--navy);font:15px/1.7 "Yu Gothic UI",Meiryo,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e89a28;outline-offset:3px}button{border:1px solid #bccdd3;border-radius:7px;padding:10px 16px;background:white;color:var(--navy)}button:hover:not(:disabled){background:#edf4f4}.primary{background:var(--teal);color:white;border-color:var(--teal)}.primary:hover:not(:disabled){background:#00635a}.ghost{background:transparent}.top{background:#132f40;color:white;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:800;letter-spacing:.04em}.brand small{font-weight:400;opacity:.72;margin-left:16px}.sandbox{font-size:12px;color:#e0edf1}.shell{max-width:1380px;margin:auto;padding:26px}.roles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.roles button[aria-pressed=true]{background:var(--navy);color:white;border-color:var(--navy)}.role-note{color:var(--muted);margin:6px 0 22px}.layout{display:grid;grid-template-columns:224px minmax(0,1fr);gap:28px}aside{align-self:start}nav{display:grid;gap:8px}nav button{text-align:left;border:0;background:transparent;padding:14px}nav button.active{background:#dceee9;color:#00665c;font-weight:700}.aside-note{padding:18px;margin-top:28px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--teal)}h1{font-size:28px;line-height:1.45;margin:8px 0}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p{margin:6px 0 15px}.muted{color:var(--muted)}.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}.card.accent{border-top:4px solid var(--teal)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.two{grid-template-columns:1fr 1fr}.stat{font-size:32px;font-weight:750;line-height:1.5}.pill{display:inline-block;padding:3px 10px;border-radius:30px;background:#eaf0f3;font-size:12px;font-weight:700;white-space:nowrap}.pill.green{background:var(--pale);color:#00675c}.pill.amber{background:#fff1d8;color:var(--amber)}.pill.red{background:#ffebe8;color:var(--red)}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.steps{display:flex;list-style:none;padding:0;gap:6px;margin:16px 0 24px;flex-wrap:wrap}.steps li{background:#e8edf0;padding:8px 14px;border-radius:6px;color:var(--muted);font-size:13px}.steps .current{background:var(--teal);color:white}.steps .done{background:#ddefe8;color:#126253}label{display:block;margin:14px 0;font-weight:600}input:not([type=checkbox]),textarea,select{display:block;width:100%;border:1px solid #b7c9cf;border-radius:6px;padding:11px;background:white;color:var(--navy);margin-top:6px}textarea{min-height:90px;resize:vertical}input[type=checkbox]{width:18px;height:18px;vertical-align:middle;margin-right:8px;accent-color:var(--teal)}.hint{font-weight:400;font-size:13px;color:var(--muted)}.notice{padding:14px 18px;background:#edf6f3;border-left:3px solid var(--teal);margin:16px 0}.notice.warn{background:#fff6e6;border-color:#cb8f35}.issue{border:1px solid var(--line);border-radius:9px;padding:20px;margin:12px 0}.issue h3{font-size:18px;margin-top:10px}.issue button{padding:7px 12px}.checklist{list-style:none;padding:0}.checklist li{padding:10px 0;border-bottom:1px solid #edf1f3}.checklist li:before{content:'✓';color:var(--teal);font-weight:800;margin-right:12px}.checklist li.pending:before{content:'○';color:var(--amber)}.report{max-width:850px;margin:auto;background:white;padding:40px;border:1px solid var(--line)}.report h1{font-size:30px}.report hr{border:0;border-top:1px solid var(--line);margin:28px 0}.report .draft{border:1px dashed var(--amber);padding:12px;color:var(--amber);margin:20px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted)}.route{border-left:3px solid #b8d9cf;padding-left:22px}.route p{padding:10px;background:#f5f8f8}.sticky{position:relative;padding:16px 20px;box-shadow:0 4px 20px #14344714}.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:white;padding:15px 22px;border-radius:8px;max-width:480px;z-index:4}.toast:empty{display:none}dialog{border:0;border-radius:14px;max-width:850px;width:calc(100% - 32px);max-height:90vh;padding:28px;box-shadow:0 15px 70px #1235}dialog::backdrop{background:#102b3a88}svg{width:100%;max-height:290px;background:#f4f6f7;border-radius:8px}.sample{color:var(--muted);font-size:12px;margin:10px 0}.ready{font-size:13px;color:var(--teal)}.link{color:var(--teal);text-decoration:underline;border:0;background:none;padding:4px}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap}.aside-note{display:none}.grid{grid-template-columns:1fr}.top{padding:12px 18px}.brand small{display:none}.shell{padding:18px}.report{padding:22px}.head{align-items:start}}@media print{.top,.roles,.role-note,aside,.actions,.steps,.toast,.head,.sticky{display:none!important}.layout{display:block}.shell{padding:0}.report{border:0;max-width:none}body{background:white}}
.notice.risk-high{border-color:#b74135;background:#fff0ec}.risk-high strong{color:#9f3027}.roles,aside,#roleNote{display:none!important}.layout{display:block}.shell{max-width:1180px}</style></head><body>
<header class="top"><div class="brand">SITE EXAM_ <small>サイト診断</small></div><span class="sandbox">操作確認用モック｜架空の案件・診断結果</span></header>
<div class="shell"><div class="row"><div class="roles" aria-label="担当者の切り替え"><button id="operatorRole" aria-pressed="true" onclick="switchRole('operator')">診断担当者の画面</button><button id="technicalRole" aria-pressed="false" onclick="switchRole('technical')">技術担当者の画面</button></div><button class="ghost" onclick="resetDemo()">サンプルを最初に戻す</button></div><p class="role-note" id="roleNote"></p><div class="layout"><aside><nav id="nav" aria-label="主な操作"></nav><div class="aside-note"><strong>このモックで試せること</strong><p>登録・診断・採点確認・差し戻し・承認を操作できます。</p><p>実際のサイト診断・メール送信・ログイン・API通信は行いません。入力は再読み込みで消えます。</p></div></aside><main id="main"></main></div></div><div class="toast" id="toast" role="status"></div><dialog id="detail"><div id="detailBody"></div><div class="actions"><button onclick="document.getElementById('detail').close()">閉じる</button></div></dialog>
<script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({role:'operator',view:'home',stage:'new',step:1,customer:'青葉菓子店（サンプル）',url:'https://example.com',scores:[[5,4,4],[2,3,2],[3,4,3]],scoreState:['暫定','暫定','確定'],reasons:[['社内資料が含まれる場合、機密情報の漏えいにつながるため。内容は未確認。','ログインなしでファイルの応答を確認したため。','公開URLを知る第三者がアクセスできる想定のため。'],['商品情報が伝わらない可能性があるため。','対象画像を読み上げる場合に発生する想定のため。','商品紹介の2ページが対象のため。'],['お問い合わせへの移動が妨げられるため。','フッターのリンク操作で繰り返し再現したため。','8ページの共通フッターから利用されるため。']],login:'なし',review:[false,false,false],include:[true,true,true],notes:['','',''],comment:'',revision:1,approvedRevision:0});let s=initial(),timer;
const issues=[{title:'公開を意図しないファイルが閲覧できる可能性',category:'セキュリティ',priority:'重大',impact:'ファイルに機密情報が含まれる場合、第三者に閲覧されるおそれがあります。',fact:'ログインしていない状態で、確認対象の文書URLからHTTP 200の応答がありました。公開意図と内容は未確認です。',fix:'公開意図を確認し、非公開の資料ならアクセス制限または公開場所からの撤去を行います。',admin:'メディア一覧から対象を確認します。ページを非公開にするだけではファイルURLを制限できない場合があります。サーバー側のアクセス制限を技術担当者が検討します。',scope:'文書ファイル／1 URL',urls:['/sample-document.pdf'],steps:['許可された対象URLを確認する','未ログインの状態で対象の応答を確認する','公開意図・内容を管理者に確認する。許可なく内容を収集しない'],confidence:'公開意図・内容は未確認',work:'公開ファイルの制限'},
{title:'画像の説明がなく、内容が伝わりにくい箇所がある',category:'操作のしやすさ',priority:'計画して対応',impact:'画像を見ずに読み上げで利用する方に、商品の情報が伝わらない可能性があります。',fact:'商品画像3点の代替テキストが空です。装飾画像かどうかの確認が必要です。',fix:'情報を伝える画像に、内容に合った短い説明を設定します。装飾目的なら空のままにします。',admin:'「固定ページ → 商品紹介 → 編集」で対象の画像ブロックを選び、代替テキストを設定します。メディア側だけを変更して反映するかは実装によって異なります。',scope:'商品紹介／2ページ',urls:['/products/','/seasonal/'],steps:['商品紹介ページを開く','対象画像の代替テキストを確認する','画像の用途と周辺の説明を見比べる'],confidence:'追加確認が必要',work:'商品情報の伝わりやすさ改善'},
{title:'お問い合わせページへのリンクが開けない',category:'情報の探しやすさ',priority:'先に対応したい',impact:'フッターからお問い合わせページへ移動できません。',fact:'フッターのリンク先 /inquiry-old/ が404応答を返します。',fix:'フッターのリンクを現在のお問い合わせページへ変更します。',admin:'「外観 → メニュー」または「外観 → エディター」でフッターのリンク先を確認します。利用テーマの管理方法を技術担当者が確定します。',scope:'共通フッター／8ページ',urls:['/','/company/','/products/'],steps:['ページ下部まで移動する','「お問い合わせ」をクリックする','ページが見つからない表示になる'],confidence:'再現できた',work:'お問い合わせ導線の修復'}];
const statuses={new:'登録前',registered:'診断前',running:'診断中',diagnosed:'内容確認の依頼前',review:'技術担当者が確認中',returned:'診断担当者へ差し戻し',approved:'お客様へ提出可能',delivered:'提出済み（デモ）'};
function toast(x){document.getElementById('toast').textContent=x;clearTimeout(timer);timer=setTimeout(()=>document.getElementById('toast').textContent='',5500)}
function go(view){s.view=view;render();window.scrollTo(0,0)}
function switchRole(role){s.role=role;s.view=role==='technical'?'review':'home';render();window.scrollTo(0,0)}
function resetDemo(){if(!confirm('入力と操作状態をサンプルの初期状態に戻しますか？'))return;s=initial();render()}
function btn(label,action,primary=false,disabled=false){return `<button ${primary?'class="primary"':''} onclick="${action}" ${disabled?'disabled':''}>${label}</button>`}
function progress(active){return `<ol class="steps">${['対象を登録','自動診断','技術担当者が確認','診断報告'].map((x,i)=>`<li class="${i===active?'current':i<active?'done':''}">${i+1} ${x}</li>`).join('')}</ol>`}
function heading(label,title,sub){return `<div class="head"><div><div class="eyebrow">${label}</div><h1>${title}</h1><p class="muted">${sub}</p></div><span class="pill ${s.stage==='approved'?'green':''}">${statuses[s.stage]}</span></div>`}
function render(){document.getElementById('operatorRole').setAttribute('aria-pressed',s.role==='operator');document.getElementById('technicalRole').setAttribute('aria-pressed',s.role==='technical');document.getElementById('roleNote').textContent=s.role==='operator'?'診断担当者：対象登録・診断実行・内容確認依頼・報告書取得':'技術担当者：証拠・危険度・採点理由の確認と提出承認';const links=s.role==='operator'?[['home','案件一覧'],['register','対象を登録'],['results','診断結果'],['report','お客様向け報告書'],['flow','操作フローを見る']]:[['review','内容確認の案件'],['report','報告書を確認'],['flow','操作フローを見る']];document.getElementById('nav').innerHTML=links.map(([id,label])=>btn(label,`go('${id}')`)).join('');[...document.querySelectorAll('nav button')].forEach((b,i)=>b.classList.toggle('active',links[i][0]===s.view));document.getElementById('main').innerHTML=({home,register,results,review,report,flow}[s.view]??home)()}
function home(){const fresh=['new','registered'].includes(s.stage);return heading('案件管理','診断案件','')+`<section class="card"><div class="row"><h2>${esc(s.customer)}</h2><span class="pill">${statuses[s.stage]}</span></div><p class="muted">${esc(s.url)}</p>${fresh||s.stage==='running'?'':riskSummary()}<p>${fresh?'対象と診断範囲を登録してください。':s.stage==='review'?'技術担当者が証拠と採点を確認中です。':s.stage==='returned'?'差し戻された確認事項への回答が必要です。':s.stage==='approved'?'承認済みの報告書を取得できます。':'診断結果を確認してください。'}</p><div class="actions">${btn(fresh?'対象を登録する':s.stage==='approved'?'承認済み報告書を見る':'案件を開く',`go('${fresh?'register':s.stage==='approved'?'report':'results'}')`,true)}</div></section>`}

function register(){if(!['new','registered'].includes(s.stage))return heading('対象登録','登録済み','対象を変更した場合は再診断・再承認が必要です。')+`<div class="card">${btn('診断結果を開く',"go('results')",true)}</div>`;return heading('対象登録','診断対象','')+progress(0)+`<section class="card"><div class="eyebrow">STEP ${s.step} / 2</div><h2>${s.step===1?'対象サイト':'診断範囲・許可'}</h2>${s.step===1?`<label>お客様・サイト名<input id="customer" value="${esc(s.customer)}" required></label><label>サイトURL<input id="url" type="url" value="${esc(s.url)}" required></label><div class="actions">${btn('診断範囲を確認する','nextRegister()',true)}</div>`:`<label>管理画面のログイン情報<select id="login"><option>なし</option><option>あり</option><option>分からない</option></select></label><p class="hint">情報がなくても公開ページを診断できます。このモックでは認証しません。</p><div class="notice"><strong>対象：本番サイト／閲覧による診断</strong><br>表示・リンク・公開状態・基本的な操作性を確認します。公開ページ8ページと、依頼元が指定した文書URL1件を対象とするサンプルです。</div><div class="notice warn">投稿・設定変更・注文・フォーム送信・侵入試行・高負荷の検査は行いません。追加検証は別途、許可と検証環境を確認します。</div><label><input id="consent" type="checkbox" onchange="document.getElementById('startButton').disabled=!this.checked">対象と上記の診断範囲について、依頼元の許可を確認した</label><div class="actions">${btn('戻る',"s.step=1;render()")}<button id="startButton" class="primary" onclick="startDiagnosis()" disabled>診断を開始する</button></div>`}</section>`}

function nextRegister(){const c=document.getElementById('customer'),u=document.getElementById('url');if(!c.reportValidity()||!u.reportValidity())return;let url;try{url=new URL(u.value);if(!['http:','https:'].includes(url.protocol)||url.username||url.password)throw Error()}catch{toast('http:// または https:// から始まるサイトURLを入力してください');return}s.customer=c.value;s.url=url.href;s.step=2;render()}
function startDiagnosis(){s.login=document.getElementById('login').value;s.stage='running';s.view='results';render()}
function completeDiagnosis(){s.stage='diagnosed';render();toast('サンプル診断が完了しました。外部サイトへのアクセスは行っていません。')}
function issueCards(technical=false){return issues.map((x,i)=>`<article class="issue"><div class="row"><span class="pill">${i===0?'セキュリティ':'不具合'}</span><span class="pill">${esc(x.confidence)}</span></div><h3>${x.title}</h3><p>${x.impact}</p><div id="risk${i}">${riskBlock(i)}</div><div class="row"><span class="muted">${x.scope}</span>${btn('証拠・再現手順を見る',`showIssue(${i})`)}</div>${technical?`<details><summary>採点と理由を編集</summary><label>採点の状態<select onchange="changeRisk(${i},'state',this.value)">${['暫定','確定','採点保留'].map(v=>'<option '+(s.scoreState[i]===v?'selected':'')+'>'+v+'</option>').join('')}</select></label>${['影響の大きさ','起こりやすさ','影響範囲'].map((label,j)=>`<label>${label}<select onchange="changeRisk(${i},${j},this.value)">${Array.from({length:j===2?4:5},(_,n)=>'<option value="'+(n+1)+'" '+(s.scores[i][j]===n+1?'selected':'')+'>'+(n+1)+'</option>').join('')}</select></label><label>採点理由<textarea oninput="changeReason(${i},${j},this.value)">${esc(s.reasons[i][j])}</textarea></label>`).join('')}</details><label>対応方法<textarea id="note${i}" oninput="editNote(${i},this.value)">${esc(s.notes[i]||x.fix)}</textarea></label><label><input type="checkbox" ${s.include[i]?'checked':''} onchange="changeInclude(${i},this.checked)">報告書に掲載する</label><label><input type="checkbox" ${s.review[i]?'checked':''} onchange="checkReview(${i},this.checked)">証拠・危険度・採点理由・説明を確認した</label>`:''}</article>`).join('')}

function results(){if(['new','registered'].includes(s.stage))return heading('診断結果','診断未実施','診断対象の登録が必要です。')+`<div class="card">${btn('対象を登録する',"go('register')",true)}</div>`;if(s.stage==='running')return heading('診断中','サイトを順番に確認しています','操作例を確認するため、下のボタンで完了画面へ進めます。')+progress(1)+`<section class="card accent"><ul class="checklist"><li>公開ページの確認</li><li>スマートフォン表示の確認</li><li class="pending">証拠の整理と、同じ問題のまとめ</li></ul><p>実製品では実際の検査進捗を表示し、自動で完了します。</p>${btn('サンプル診断の完了画面へ','completeDiagnosis()',true)}</section>`;return heading('診断結果','検出課題','同じ課題はURLをまとめて表示します。')+progress(s.stage==='approved'||s.stage==='delivered'?3:2)+(s.stage==='returned'?`<div class="notice warn"><strong>技術担当者からの確認事項</strong><p>${esc(s.comment)}</p><label>確認できた内容<textarea id="reply" placeholder="お客様へ確認した内容などを記入"></textarea></label>${btn('回答して再確認を依頼','resubmit()',true)}</div>`:'')+`${riskSummary()}<section class="card"><h2>課題一覧</h2>${issueCards()}</section><section class="card sticky"><p><strong>${s.stage==='diagnosed'?'お客様へ案内する前に、技術担当者の確認を依頼します。':s.stage==='review'?'内容確認中です。担当者の確認を待ってください。':''}</strong></p><div class="actions">${btn('報告書を確認する',"go('report')")}${s.stage==='diagnosed'?btn('技術担当者へ確認を依頼','requestReview()',true):s.stage==='review'?btn('技術担当者の画面へ',"switchRole('technical')",true):s.stage==='approved'?btn('承認済み報告書を見る',"go('report')",true):''}</div></section>`}
function requestReview(){s.stage='review';s.review=[false,false,false];render();toast('内容直接確認に変更しました（モック内のみ）。担当者の画面を切り替えて続けられます。')}
function resubmit(){const r=document.getElementById('reply').value.trim();if(!r){toast('確認した内容を記入してください');return}s.comment+='\n診断担当者からの回答：'+r;s.stage='review';s.review=[false,false,false];render();toast('回答付きで再確認を依頼しました（デモ）。')}
function review(){if(!['review','approved','delivered','returned'].includes(s.stage))return heading('内容確認','確認依頼を受けた案件が表示されます','診断担当者から依頼された後、証拠と採点理由を確認します。')+`<section class="card"><div class="empty">現在のサンプルは、まだ確認依頼前です。</div><div class="actions">${btn('診断担当者の画面から試す',"switchRole('operator')",true)}${btn('直接確認のサンプルを開く',"s.stage='review';render()")}</div></section>`;if(s.stage!=='review')return heading('内容確認',esc(s.customer),s.stage==='returned'?'診断担当者の回答を待っています。':'提出を承認した版を確認できます。')+`<section class="card"><p>${esc(s.comment)}</p><div class="actions">${btn('報告書を見る',"go('report')")}${s.stage==='returned'?btn('診断担当者の画面へ',"switchRole('operator')",true):btn('修正のため確認を再開',"s.stage='review';s.approvedRevision=0;s.review=[false,false,false];s.revision++;render()")}</div></section>`;return heading('内容確認',esc(s.customer),'証拠・危険度・採点理由を確認し、報告内容を承認します。')+progress(2)+(s.comment?`<div class="notice">${esc(s.comment)}</div>`:'')+`<section class="card"><div class="row"><h2>確認する問題</h2><span id="reviewCount" class="pill green">${s.review.filter(Boolean).length} / 3 確認済み</span></div><p class="muted">このモックの証拠は説明用です。実製品では実際の画像・検査日時・対象URL・再現結果を表示します。</p>${issueCards(true)}</section><section class="card"><h2>確認・承認</h2><label>診断担当者への連絡<textarea id="comment" oninput="s.comment=this.value" placeholder="差し戻す場合は、誰に何を確認すればよいかを記載">${esc(s.comment)}</textarea></label><div class="notice warn">未確認の範囲と、断定できない内容は報告書に残ります。承認は今回の診断内容に対するもので、サイト全体の安全性を保証するものではありません。</div><div class="actions">${btn('報告書をプレビュー',"go('report')")}${btn('確認事項を差し戻す','returnReview()')}${btn('お客様への提出を承認','approve()',true,!s.review.every(Boolean))}</div><p class="hint" id="approvalHint">3件すべての確認後に承認できます。採点・理由・説明の変更は確認を解除します。暫定点・採点保留も、その状態を残して報告できます。</p></section>`}
function updateReviewControls(){document.getElementById('reviewCount').textContent=s.review.filter(Boolean).length+' / 3 確認済み';document.querySelector('[onclick="approve()"]').disabled=!s.review.every(Boolean)}
function editNote(i,v){s.notes[i]=v;s.review[i]=false;s.revision++;s.approvedRevision=0;const area=document.getElementById('note'+i).closest('article');area.querySelectorAll('input[type=checkbox]')[1].checked=false;updateReviewControls()}
function changeInclude(i,value){s.include[i]=value;s.review[i]=false;s.revision++;s.approvedRevision=0;const area=document.getElementById('note'+i).closest('article');area.querySelectorAll('input[type=checkbox]')[1].checked=false;updateReviewControls()}
function checkReview(i,value){if(value&&s.reasons[i].some(r=>!r.trim())){toast('採点理由をすべて記入してください');document.getElementById('note'+i).closest('article').querySelectorAll('input[type=checkbox]')[1].checked=false;return;}if(value&&s.include[i]&&s.notes[i]&&!s.notes[i].trim()){toast('修正内容を記入してください');return}s.review[i]=value;updateReviewControls()}
function returnReview(){const c=document.getElementById('comment').value.trim();if(!c){toast('診断担当者に確認してほしい内容を記入してください');return}s.comment=c;s.stage='returned';s.approvedRevision=0;render();toast('差し戻しました。診断担当者の画面で回答できます。')}
function approve(){if(s.role!=='technical'||s.stage!=='review'||!s.review.every(Boolean))return;s.comment=document.getElementById('comment').value;s.stage='approved';s.approvedRevision=s.revision;s.view='report';render();toast('今回の版を提出可能にしました（デモ）。')}
function approved(){return ['approved','delivered'].includes(s.stage)&&s.approvedRevision===s.revision}
function reportContent(){const ok=approved();return `<article class="report"><div class="eyebrow">SITE DIAGNOSIS / SAMPLE</div><h1>サイト診断報告書</h1><p>${esc(s.customer)} 様</p><p class="sample">架空の診断結果です。実サイトを調査したものではありません。</p><span class="pill ${ok?'green':'amber'}">${ok?'内容確認済み（デモ）':'下書き・提出不可'}</span><p>版 ${s.revision} ／ ${ok?'評価内容を確認済み':'評価内容の確認前'}</p>${riskSummary()}<h2>診断範囲</h2><p>公開ページ8ページ・指定文書URL1件。予定40項目のうち32項目を実施した想定です。</p><div class="notice warn">8項目は未確認：管理設定3項目、メール到着2項目、注文完了3項目。未確認を安全または不具合とは判定していません。</div><h2>課題・危険度・根拠</h2>${issues.map((x,i)=>s.include[i]?`<section class="issue"><h3>${x.title}</h3><p>${x.impact}</p>${riskBlock(i)}<p><strong>確認できた事実：</strong>${x.fact}</p><p><strong>証拠：</strong>サンプル観測記録 E-0${i+1} ／ ${x.urls.map(esc).join('、')}（代表URL）</p><p><strong>確認の確かさ：</strong>${x.confidence}</p><p><strong>対応方法：</strong>${esc(s.notes[i]||x.fix)}</p><ol>${x.steps.map(v=>'<li>'+esc(v)+'</li>').join('')}</ol></section>`:'').join('')}<hr><h2>評価の読み方</h2><p>危険度は影響（1～5）×起こりやすさ（1～5）×範囲（1～4）。80～100：重大、50～79：高、20～49：中、1～19：低。運用前に調整する独自基準案です。CVSSではありません。</p><p>暫定点は未確認の前提を含みます。根拠不足の項目は採点保留とし、0点にはしません。内容確認は報告内容の確認であり、サイトの安全性を保証するものではありません。</p></article>`}

function report(){if(['new','registered','running'].includes(s.stage))return heading('報告書','診断完了後に下書きを作成します','まだ実施していない検査を、結果として表示しません。')+`<div class="card">${btn('診断へ戻る',"go('results')",true)}</div>`;return heading('報告書',approved()?'お客様へ案内できます':'報告書の下書き','課題・採点根拠・未確認の範囲を掲載します。')+`<div class="actions" style="margin-bottom:20px">${btn(s.role==='technical'?'内容確認に戻る':'診断結果へ戻る',`go('${s.role==='technical'?'review':'results'}')`)}${btn('承認済みHTMLをダウンロード','downloadReport()',true,!approved())}${s.role==='operator'?btn('提出済みにする（デモ）',"s.stage='delivered';render();toast('提出済みとして記録しました。メールは送信していません。')",false,!approved()):''}</div>`+reportContent()}
function downloadReport(){if(!approved())return;const style=document.querySelector('style').textContent;const blob=new Blob(['<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サンプル診断レポート</title><style>'+style+'</style><body>'+reportContent()+'</body></html>'],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sample-approved-report.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('サンプル報告書をダウンロードしました。実際の診断結果ではありません。')}
function showIssue(i){const x=issues[i];document.getElementById('detailBody').innerHTML=`<span class="pill">観測記録 E-0${i+1} ／ 架空データ</span><h2>${x.title}</h2><h3>観測した事実</h3><p>${x.fact}</p><div class="notice"><strong>確認の確かさ：</strong>${x.confidence}<br><strong>観測条件：</strong>${i===0?'未ログイン・指定URLの応答確認':i===1?'商品画像の代替テキスト確認':'共通フッターからの移動'}<br><strong>確認日時：</strong>2026年10月29日 10:00（サンプル）</div><h3>証拠の表示例</h3><pre style="white-space:pre-wrap;background:#f0f4f6;padding:16px">${i===0?'GET /sample-document.pdf → HTTP 200\n本文の内容・公開意図：未確認':i===1?'商品画像3点：alt属性が空\n装飾画像としての妥当性：未確認':'リンク先 /inquiry-old/ → HTTP 404\n共通フッター8ページで同じ参照先'}</pre><p class="sample">上記は証拠形式のサンプルです。実製品では観測結果と、該当箇所を示す画像を紐付けます。</p><h3>再現・追加確認の手順</h3><ol>${x.steps.map(v=>'<li>'+v+'</li>').join('')}</ol>${riskBlock(i)}<h3>対応方法</h3><p>${x.admin}</p><details><summary>対象URL（代表例）</summary><ul>${x.urls.map(u=>'<li>'+u+'</li>').join('')}</ul></details>`;document.getElementById('detail').showModal()}

function flow(){return heading('操作設計','役割ごとの操作フロー','技術担当者の承認を、お客様への提出前に置きます。')+`<div class="grid two"><section class="card"><span class="eyebrow">診断担当者</span><h2>依頼を受けて、診断を進める</h2><div class="route"><p>① お客様・URL・診断対象を入力</p><p>② 調査できる範囲を確認</p><p>③ 診断を開始して完了を待つ</p><p>④ 課題・危険度・未確認の範囲を読む</p><p>⑤ 技術担当者へ確認を依頼</p><p>⑥ 承認後、報告書を取得・提出</p></div><p class="hint">差し戻しがあれば、お客様への質問や不足情報の確認を行います。</p></section><section class="card"><span class="eyebrow">技術担当者</span><h2>証拠と危険度を確認する</h2><div class="route"><p>① 確認依頼の案件を開く</p><p>② 画像・URL・再現手順を確認</p><p>③ 危険度・採点理由・確認の確かさを確認</p><p>④ 採点と説明を調整</p><p>⑤ 必要なら担当者へ差し戻し</p><p>⑥ 報告書を確認し提出を承認</p></div><p class="hint">承認後に内容を変更した場合は、承認を外して再確認します。</p></section></div><div class="card"><h2>実製品に引き継ぐルール</h2><ul><li>役割別の権限と承認はサーバーで制御します。このモックの役割切り替えは操作体験用です。</li><li>検査結果とAIによる説明を分け、元の証拠を保持します。</li><li>要望・改善提案・見積もりは診断と分けて扱います。</li><li>診断や内容の更新ごとに版を持ち、承認者・日時・変更履歴を記録します。</li><li>実際の通知・提出は、利用者が指定する送付先と送信操作に基づいて行います。</li></ul></div>`}
function score(i){return s.scoreState[i]==='採点保留'?null:s.scores[i].reduce((a,b)=>a*b,1)}
function level(n){return n===null?'採点保留':n>=80?'重大':n>=50?'高':n>=20?'中':'低'}
function riskBlock(i){const n=score(i);return '<div class="notice '+(n!==null&&n>=50?'risk-high':n!==null&&n>=20?'warn':'')+'"><div class="row"><strong>危険度 '+(n===null?'採点保留':n+' / 100 ・ '+level(n))+'</strong><span class="pill">'+esc(s.scoreState[i])+'</span></div><p class="hint">'+(n===null?'判断材料が不足しているため点数を付けていません。':s.scores[i].join(' × ')+' ＝ '+n+'点（影響 × 起こりやすさ × 範囲）')+'</p><details><summary>採点理由</summary>'+s.reasons[i].map((r,j)=>'<p><strong>'+['影響','起こりやすさ','範囲'][j]+' '+s.scores[i][j]+'：</strong>'+esc(r)+'</p>').join('')+'</details></div>'}
function riskSummary(){const values=issues.map((_,i)=>score(i)).filter(n=>n!==null),max=values.length?Math.max(...values):null;return '<div class="grid two"><div class="card"><span class="eyebrow">検出課題の最高危険度</span><div class="stat">'+(max===null?'採点保留':max+' / 100')+'</div><p>'+level(max)+' ／ '+(max===null?'根拠の追加確認が必要':issues.some((_,i)=>score(i)===max&&s.scoreState[i]==='暫定')?'暫定点を含む':'採点済み')+'</p><p class="hint">全3課題を集計。掲載から外した課題も含みます。サイト全体の安全性を表す点数ではありません。</p><details><summary>評価基準</summary><p>影響1～5 × 起こりやすさ1～5 × 範囲1～4。80以上：重大、50以上：高、20以上：中、19以下：低。独自基準案です。</p><p>確実性は点数と別に示します。根拠不足は採点保留とし、0点にはしません。</p></details></div><div class="card"><span class="eyebrow">診断・確認状況</span><h3>セキュリティ 1件 ／ 不具合 2件</h3><p>予定40項目中32項目実施・8項目未確認<br>内容確認 '+s.review.filter(Boolean).length+' / 3件・採点保留 '+s.scoreState.filter(v=>v==='採点保留').length+'件</p><p class="hint">未確認：管理設定3、メール到着2、注文完了3。未確認の項目を0点として扱いません。</p></div></div>'}
function invalidateRisk(i){s.review[i]=false;s.revision++;s.approvedRevision=0;const row=document.getElementById('note'+i).closest('article');row.querySelectorAll('input[type=checkbox]')[1].checked=false;document.getElementById('risk'+i).innerHTML=riskBlock(i);updateReviewControls()}
function changeRisk(i,j,value){if(j==='state')s.scoreState[i]=value;else s.scores[i][j]=Number(value);invalidateRisk(i)}
function changeReason(i,j,value){s.reasons[i][j]=value;invalidateRisk(i)}

function runUnified(){s.stage='diagnosed';s.review=[false,false,false];s.revision++;s.approvedRevision=0;render();}
function render(){document.getElementById('main').innerHTML='<div class="head"><div><h1>SITE EXAM_</h1><p>サイト診断・危険度評価</p></div><span class="pill">操作モック／架空データ</span></div><section class="card"><h2>診断対象</h2><label>サイト名<input value="'+esc(s.customer)+'" onchange="s.customer=this.value;s.revision++"></label><label>サイトURL<input value="'+esc(s.url)+'" onchange="s.url=this.value;s.revision++"></label><p>公開ページ8ページ・指定文書URL1件。閲覧中心の診断を行うサンプルです。</p><button class="primary" onclick="runUnified()">サンプル診断を実行</button></section>'+(s.stage==='new'?'':riskSummary()+'<section class="card"><div class="row"><h2>課題・採点・証拠</h2><span id="reviewCount" class="pill">'+s.review.filter(Boolean).length+' / 3 内容確認</span></div><p>同じページで内容を確認・編集します。実製品にはClaudeの説明候補を選んで反映する機能を追加しています。このモックからAPIには送信しません。</p>'+issueCards(true)+'</section><section class="card"><div class="actions"><button class="primary" onclick="approve()">評価を保存</button><button onclick="previewUnified()">顧客向けHTMLを確認</button><button onclick="downloadReport()">HTMLをダウンロード</button></div><p>編集後は保存が必要です。内容未確認の項目がある報告書は下書きになります。</p></section><div id="reportPreview"></div>');}
function updateReviewControls(){const el=document.getElementById('reviewCount');if(el)el.textContent=s.review.filter(Boolean).length+' / 3 内容確認';}
function approve(){s.approvedRevision=s.revision;s.stage='saved';toast('評価を保存しました（モック内のみ）。');render();}
function approved(){return s.approvedRevision===s.revision&&s.review.every(Boolean);}
function previewUnified(){if(s.approvedRevision!==s.revision){toast('評価を保存してください。');return;}document.getElementById('reportPreview').innerHTML=reportContent();document.getElementById('reportPreview').scrollIntoView({block:'start'});}
function downloadReport(){if(s.approvedRevision!==s.revision){toast('評価を保存してください。');return;}const blob=new Blob(['<!doctype html><html lang="ja"><meta charset="utf-8"><title>SITE EXAM_ サンプル診断報告</title><style>'+document.querySelector('style').textContent+'</style>'+reportContent()+'</html>'],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='site-exam-sample.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

render();
</script></body></html>
