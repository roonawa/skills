services:
  qa:
    build: ..
    init: true
    restart: unless-stopped
    shm_size: 1gb
    stop_grace_period: 5m
    environment:
      WPQA_PUBLIC_ORIGIN: ${WPQA_PUBLIC_ORIGIN:?Set HTTPS origin}
      WPQA_ENCRYPTION_KEY_FILE: /run/secrets/qa_key
      WPQA_USERS_FILE: /run/secrets/qa_users
      WPQA_DATA_DIR: /data
    secrets: [qa_key, qa_users]
    volumes: [qa_data:/data]
    networks: [backend]
    security_opt: [no-new-privileges:true]
    # No published application port. Only the TLS proxy can reach this service.
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${WPQA_BIND_IP:-127.0.0.1}:${WPQA_PORT:-8443}:443"
    environment:
      WPQA_DOMAIN: ${WPQA_DOMAIN:?Set internal DNS hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    depends_on: [qa]
secrets:
  qa_key:
    file: ./secrets/key
  qa_users:
    file: ./secrets/users.json
volumes:
  qa_data:
  caddy_data:
  caddy_config:
networks:
  backend:
